{% extends "base.html" %}

{% block content %}
<h2>CSV 파일 목록</h2>
<div class="card">
    {% for file in files %}
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; border-bottom:1px solid #eee; padding-bottom:5px">
        <span>{{ file }}</span>
        <a href="{{ url_for('admin.edit_csv', filename=file) }}" class="btn" style="width:auto">편집</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
