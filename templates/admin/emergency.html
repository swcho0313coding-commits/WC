{% extends "base.html" %}
{% block content %}
<h2>비상사태 관리</h2>
<div class="card">
    <h3>🚨 긴급 선포</h3>
    <form method="POST">
        <label>종류</label>
        <select name="type">
            <option value="emergency">비상사태</option>
            <option value="martial_law">계엄령</option>
            <option value="jindogae">진도개</option>
        </select>
        <input type="hidden" name="status" value="active">
        <button type="submit" class="btn alert-danger">선포하기</button>
    </form>
    <form method="POST" style="margin-top:10px">
        <input type="hidden" name="status" value="ended">
        <button type="submit" class="btn btn-secondary">모든 비상사태 해제</button>
    </form>
</div>

<div class="card">
    <h3>📜 선포 기록</h3>
    {% for rec in records %}
    <div style="border-bottom:1px solid #eee; padding:5px 0">
        {{ rec.timestamp }}: {{ rec.type }} ({{ rec.status }})
    </div>
    {% endfor %}
</div>
{% endblock %}
