{% extends "base.html" %}

{% block content %}
<h2>관리자 패널</h2>

<div class="card">
    <h3>📊 시스템 요약</h3>
    <p>국가명: {{ config_country_name }}</p>
    <p>화폐단위: {{ config_currency_name }}</p>
</div>

<div class="card">
    <h3>🛠️ 관리 도구</h3>
    <a href="{{ url_for('admin.manage_users') }}" class="btn">회원 관리 및 승인</a>
    <a href="{{ url_for('admin.csv_editor') }}" class="btn btn-secondary" style="margin-top:10px">CSV 테이블 에디터</a>
    <a href="{{ url_for('admin.emergency') }}" class="btn alert-danger" style="margin-top:10px; color:white">비상사태 관리</a>
</div>

<div class="card">
    <h3>📝 로그 뷰어</h3>
    <a href="#" class="btn btn-secondary">시스템 로그 조회</a>
</div>
{% endblock %}
