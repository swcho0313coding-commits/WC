{% extends "base.html" %}
{% block content %}
<h2>회원 관리</h2>
<div class="card" style="overflow-x:auto">
    <table style="width:100%; border-collapse: collapse;">
        <thead>
            <tr style="background:#f4f4f4">
                <th style="border:1px solid #ddd; padding:8px">이름</th>
                <th style="border:1px solid #ddd; padding:8px">ID</th>
                <th style="border:1px solid #ddd; padding:8px">등급</th>
                <th style="border:1px solid #ddd; padding:8px">상태</th>
                <th style="border:1px solid #ddd; padding:8px">전화번호</th>
                <th style="border:1px solid #ddd; padding:8px">관리</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td style="border:1px solid #ddd; padding:8px">{{ user.name }}</td>
                <td style="border:1px solid #ddd; padding:8px">{{ user.login_id }}</td>
                <td style="border:1px solid #ddd; padding:8px">{{ user.grade }}</td>
                <td style="border:1px solid #ddd; padding:8px">{{ user.status }}</td>
                <td style="border:1px solid #ddd; padding:8px">
                    <a href="tel:{{ user.phone }}">{{ user.phone }}</a>
                </td>
                <td style="border:1px solid #ddd; padding:8px">
                    {% if user.status == 'pending' %}
                    <a href="{{ url_for('admin.approve_user', name=user.name) }}" class="btn" style="padding:5px; width:auto">승인</a>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
