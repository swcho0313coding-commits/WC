{% extends "base.html" %}

{% block content %}
<h2>채팅방 목록</h2>
{% for room in rooms %}
<a href="{{ url_for('chat.room', room_id=room.room_id) }}" class="card" style="display:block; text-decoration:none; color:inherit;">
    <div style="font-weight:bold; font-size:1.1rem">{{ room.name }}</div>
    <div style="color:#666; font-size:0.9rem; margin-top:5px">{{ room.last_message or '대화 없음' }}</div>
    <div style="color:#999; font-size:0.8rem; text-align:right">{{ room.timestamp }}</div>
</a>
{% endfor %}
{% endblock %}
