{% extends "base.html" %}
{% block content %}
<h2>내각 관리</h2>
<div class="card">
    <form action="{{ url_for('politics.appoint_cabinet') }}" method="POST">
        <label>임명 대상 사용자</label>
        <select name="user">
            {% for u in users %}
            <option value="{{ u.name }}">{{ u.name }} (현재: {{ u.grade }})</option>
            {% endfor %}
        </select>

        <label>지명 직급</label>
        <select name="grade">
            <option value="국무총리급">국무총리</option>
            <option value="행정 1등급">행정 1등급</option>
            <option value="입법 1등급">입법 1등급</option>
            <option value="사법 1등급">사법 1등급</option>
            <option value="행정 2등급">행정 2등급</option>
            <option value="입법 2등급">입법 2등급</option>
            <option value="사법 2등급">사법 2등급</option>
        </select>

        <button type="submit" class="btn">임명하기</button>
    </form>
</div>
{% endblock %}
